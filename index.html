                                    <div><p className="text-slate-400 text-xs">Flagged Event</p><p>{DEMO_INCIDENT.type}</p></div>
                                    <div><p className="text-slate-400 text-xs">AI Confidence</p><p className="text-yellow-400 font-bold">{DEMO_INCIDENT.confidence}%</p></div>
                                    <div><p className="text-slate-400 text-xs">Location</p><p>{DEMO_INCIDENT.location}</p></div>
                                    <div><p className="text-slate-400 text-xs">Time</p><p>{DEMO_INCIDENT.timestamp}</p></div>
                                </div>
                            </Card>
                            <Card className="p-4 bg-navy-900">
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    By clicking confirm, you verify that a safety violation occurred based on visual evidence, independent of the AI prediction.
                                </p>
                            </Card>
                        </div>
                    </div>
                </div>
            );
        };
            const SafetyMap = () => (
            <div className="h-full flex flex-col space-y-4 fade-in">
                <header className="flex justify-between items-end">
                    <div>
                        <h1 className="text-2xl font-bold">Safety Map</h1>
                        <p className="text-slate-400 text-sm mt-1">Verified incident hotspots</p>
                    </div>
                    <DemoBadge />
                </header>
                <Card className="flex-1 min-h-[400px] relative p-0 overflow-hidden border-slate-700">
                    {/* Mock Map Background */}
                    <div className="absolute inset-0 bg-[#060a13] opacity-80" style={{
                        backgroundImage: `radial-gradient(#1e293b 1px, transparent 1px)`,
                        backgroundSize: '20px 20px'
                    }}></div>
                    
                    {/* Hotspot */}
                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 cursor-pointer group">
                        <div className="absolute inset-0 bg-red-500 rounded-full animate-pulse-ring"></div>
                        <div className="relative w-6 h-6 bg-red-500 rounded-full border-2 border-white flex items-center justify-center z-10 shadow-lg"></div>
                        
                              {/* Tooltip */}
                        <div className="absolute bottom-full mb-4 left-1/2 transform -translate-x-1/2 w-64 bg-navy-800 border border-slate-700 p-4 rounded-xl shadow-2xl opacity-100 transition-opacity z-20 hidden group-hover:block">
                            <h3 className="font-bold text-white mb-1">Sector 128</h3>
                            <p className="text-xs text-slate-400 mb-3">24 reported events</p>
                            <div className="space-y-2 text-xs">
                                <div className="flex justify-between"><span className="text-slate-400">Peak time:</span> <span>6 PM – 9 PM</span></div>
                                <div className="border-t border-slate-700 pt-2 mt-2">
                                    <span className="text-slate-400 block mb-1">Patterns:</span>
                                    <div className="flex gap-2 flex-wrap">
                                        <span className="bg-red-500/20 text-red-400 px-2 py-1 rounded">Phone use</span>
                                        <span className="bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded">No helmet</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                              
                    {/* Overlay UI */}
                    <div className="absolute top-4 left-4 flex gap-2">
                        <Button variant="secondary" className="text-xs py-1 px-3 bg-navy-900">All</Button>
                        <Button variant="secondary" className="text-xs py-1 px-3">Phone</Button>
                        <Button variant="secondary" className="text-xs py-1 px-3">Helmet</Button>
                    </div>
                    <div className="absolute bottom-4 right-4 bg-navy-900 border border-slate-700 p-2 text-[10px] text-slate-400 rounded">
                        Not real-time government traffic data. Demo purposes only.
                    </div>
                </Card>
            </div>
        );
        const Emergency = () => (
            <div className="h-full flex flex-col items-center justify-center fade-in text-center p-6">
                <SimulatedBadge />
                <div className="w-24 h-24 bg-red-500/20 rounded-full flex items-center justify-center mb-6 animate-pulse">
                    <Icons.AlertTriangle className="text-red-500 w-12 h-12" />
                </div>

                     <h1 className="text-3xl font-bold text-red-500 mb-2">Possible Crash Detected</h1>
                <p className="text-slate-400 mb-8 max-w-sm">Movement change and impact pattern detected. Initiating emergency protocol in 10 seconds.</p>
                <div className="text-6xl font-bold mb-8">10</div>
                <div className="flex gap-4">
                    <Button variant="secondary" className="px-8 py-4 text-lg">I'M OK</Button>
                    <Button variant="danger" className="px-8 py-4 text-lg bg-red-600 text-white hover:bg-red-700">SEND ALERT</Button>
                </div>
            </div>
        );
        const PlaceholderPage = ({ title }) => (
            <div className="h-full flex flex-col items-center justify-center text-slate-500 fade-in">
                <Icons.FileText />
                <h2 className="mt-4 text-xl">{title}</h2>
                <p className="text-sm mt-2">Secondary screen placeholder</p>
            </div>
        );
        // --- Main App & Navigation ---
        const App = () => {
            const [path, setPath] = useState('landing');
            const [user, setUser] = useState(null);
            const [incidentStatus, setIncidentStatus] = useState('Awaiting Human Review');
            const [sidebarOpen, setSidebarOpen] = useState(false);
                        const navigate = (newPath) => {
                setPath(newPath);
                setSidebarOpen(false);
            };
            if (path === 'landing') return <Landing navigate={navigate} />;
            if (path === 'signup') return <Signup navigate={navigate} setUser={setUser} />;
            const navItems = [
                { id: 'dashboard', icon: Icons.LayoutDashboard, label: 'Dashboard' },
                { id: 'analyse', icon: Icons.Video, label: 'Analyse Ride' },
                { id: 'review', icon: Icons.Shield, label: 'Review Centre' },
                { id: 'map', icon: Icons.Map, label: 'Safety Map' },
                { id: 'emergency', icon: Icons.AlertTriangle, label: 'Emergency' },
            ];
            const renderContent = () => {
                switch (path) {
                    case 'dashboard': return <Dashboard navigate={navigate} user={user} />;
                    case 'analyse': return <AnalyseRide navigate={navigate} />;
                    case 'analysis': return <AIAnalysis navigate={navigate} />;
                         case 'evidence': return <Evidence navigate={navigate} incidentStatus={incidentStatus} setIncidentStatus={setIncidentStatus} />;
                    case 'review': return <ReviewCentre navigate={navigate} incidentStatus={incidentStatus} />;
                    case 'review-detail': return <ReviewDetail navigate={navigate} incidentStatus={incidentStatus} setIncidentStatus={setIncidentStatus} />;
                    case 'map': return <SafetyMap navigate={navigate} />;
                    case 'emergency': return <Emergency />;
                    default: return <PlaceholderPage title={path.charAt(0).toUpperCase() + path.slice(1)} />;
                }
            };
            return (
                <div className="flex h-screen bg-navy-900 overflow-hidden text-slate-100">
                    {/* Desktop Sidebar */}
                    <aside className="hidden md:flex flex-col w-64 bg-navy-800 border-r border-slate-800 flex-shrink-0">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="bg-blue-600 p-1.5 rounded-lg"><Icons.Shield /></div>
                            <span className="font-bold text-xl tracking-tight">RoadShield</span>
                        </div>
                        <nav className="flex-1 py-4 px-3 space-y-1">
                  {navItems.map(item => (
                                <button key={item.id} onClick={() => navigate(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors ${path === item.id || (path.startsWith(item.id) && item.id !== 'dashboard') ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <item.icon />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3 bg-navy-900 p-3 rounded-lg border border-slate-800">
                                <div className="w-8 h-8 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">
                                    {user?.name?.[0] || 'U'}
                                </div>
                                <div className="text-left flex-1">
                                    <p className="text-sm font-medium text-white">{user?.name || 'Demo User'}</p>
                                    <p className="text-xs text-slate-500">{user?.role || 'Guest'}</p>
                                </div>
                            </div>
                        </div>
                    </aside>
                                        {/* Mobile Header & Sidebar overlay */}
                    <header className="md:hidden absolute top-0 left-0 right-0 h-16 bg-navy-800 border-b border-slate-800 flex items-center justify-between px-4 z-20">
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-slate-400 p-2"><Icons.Menu /></button>
                        <div className="flex items-center gap-2 font-bold"><Icons.Shield className="text-blue-500 w-5 h-5"/> RoadShield</div>
                        <div className="w-8"></div>
                    </header>
                    
                    {sidebarOpen && (
                        <div className="fixed inset-0 z-50 md:hidden bg-navy-900/95 backdrop-blur pt-16 px-4">
                            <button onClick={() => setSidebarOpen(false)} className="absolute top-4 right-4 text-slate-400 p-2"><Icons.X /></button>
                            <nav className="flex flex-col gap-2 mt-4">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => navigate(item.id)}
                                        className="flex items-center gap-4 px-4 py-4 rounded-lg bg-navy-800 border border-slate-800 text-left">
                                        <item.icon /> {item.label}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    )}
                                        {/* Main Content Area */}
                    <main className="flex-1 flex flex-col pt-16 md:pt-0 overflow-y-auto">
                        <div className="p-4 md:p-8 max-w-6xl mx-auto w-full pb-24 md:pb-8">
                            {renderContent()}
                        </div>
                    </main>
                    {/* Mobile Bottom Nav */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-navy-800 border-t border-slate-800 flex justify-around p-2 pb-safe z-10">
                        {navItems.slice(0, 4).map(item => (
                            <button key={item.id} onClick={() => navigate(item.id)}
                                className={`flex flex-col items-center gap-1 p-2 ${path === item.id ? 'text-blue-500' : 'text-slate-500'}`}>
                                <div className="w-5 h-5"><item.icon /></div>
                                <span className="text-[10px] font-medium">{item.label.split(' ')[0]}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
